name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências do Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git ffmpeg libsdl2-dev libsdl2-image-dev \
            libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev \
            libavformat-dev libavcodec-dev zlib1g-dev libsqlite3-dev sqlite3 \
            bzip2 libfreetype6-dev autoconf libtool pkg-config libssl-dev \
            libffi-dev zip unzip

      - name: Instalar Buildozer e Cython
        run: |
          pip install --upgrade pip setuptools wheel
          pip install "cython<3.0.0"
          pip install buildozer

      - name: Baixar e Configurar Android NDK r25b
        run: |
          mkdir -p $HOME/android-ndk
          cd $HOME/android-ndk
          wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
          unzip -q android-ndk-r25b-linux.zip
          rm android-ndk-r25b-linux.zip

      # --- NOVO PASSO: CRIAR A CHAVE DE ASSINATURA ---
      - name: Decodificar Keystore e Configurar Assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > minha-chave.jks
          echo "P4A_RELEASE_KEYSTORE=$PWD/minha-chave.jks" >> $GITHUB_ENV
          echo "P4A_RELEASE_KEYSTORE_PASSWD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "P4A_RELEASE_KEYALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "P4A_RELEASE_KEYALIAS_PASSWD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Gerar APK
        env:
          ANDROID_NDK_HOME: ${{ runner.workspace }}/../android-ndk/android-ndk-r25b
          ANDROID_NDK_ROOT: ${{ runner.workspace }}/../android-ndk/android-ndk-r25b
        run: |
          buildozer -v android release

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: binance-bot-apk
          path: bin/*.apk
