name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar Dependências do Sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libreadline-dev libsqlite3-dev libgdbm-dev libdb5.3-dev libbz2-dev libexpat1-dev liblzma-dev tk-dev libffi-dev libssl-dev

    - name: Instalar Buildozer e Cython
      run: |
        pip install --upgrade pip
        pip install "buildozer<2.0.0" cython

    - name: Aceitar Licenças do Android SDK (Forçado)
        run: |
            buildozer android p4a -- get-p4a-build-dir
            P4A_DIR=$(buildozer android p4a -- get-p4a-build-dir | tail -n 1)
            # Aceita licenças usando o sdkmanager do Android
            yes | $P4A_DIR/platform/android-sdk/tools/bin/sdkmanager --licenses || true

    - name: Gerar APK com Buildozer
      run: |
        buildozer android debug

    - name: Disponibilizar APK para Download
      uses: actions/upload-artifact@v4
      with:
        name: BinanceBot-APK
        path: bin/*.apk
        
